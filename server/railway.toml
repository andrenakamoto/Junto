# Migration vers Infomaniak (2026-10) : Railway ne sert plus que de relais vers https://api.evly.ch pour les
# apps installées avant la version 1.0.13 (server/relay.js). Plus de base ni de tâches planifiées ici.
[deploy]
startCommand = "node relay.js"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
