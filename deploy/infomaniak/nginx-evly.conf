# nginx du serveur EvLY (Infomaniak). Remplace Vercel (site) et Railway (API).
# Certificats HTTPS ajoutés ensuite par certbot (--nginx), qui complète ce fichier.

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# --- API et temps réel : api.evly.ch → serveur Node (127.0.0.1:3001)
server {
    listen 80;
    listen [::]:80;
    server_name api.evly.ch;
    client_max_body_size 12m;   # pièces jointes : 10 Mo (multer) + marge

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# --- Site : www.evly.ch (fichiers construits par deploy.sh dans /srv/evly/site)
server {
    listen 80;
    listen [::]:80;
    server_name www.evly.ch;
    root /srv/evly/site;
    index index.html;

    # Mêmes en-têtes de sécurité qu'avant sur Vercel (client/vercel.json)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), payment=()" always;

    # Brochure : compteur de téléchargements (routes/stats.ts), puis redirection vers le PDF
    location = /brochure { return 302 https://api.evly.ch/api/stats/go/brochure; }
    location = /evly-associations-entreprises.pdf { return 302 https://api.evly.ch/api/stats/go/brochure; }
    location = /brochure-pro { return 302 https://api.evly.ch/api/stats/go/brochure-pro; }

    # Liens d'invitation : page de l'app avec l'aperçu du Plan (routes/share.ts)
    location = /invitation {
        proxy_pass http://127.0.0.1:3001/api/share/invitation$is_args$args;
        proxy_set_header Host api.evly.ch;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Liens d'un Cercle : page de l'app avec l'aperçu dans la langue du lien (routes/share.ts)
    location = /rejoindre {
        proxy_pass http://127.0.0.1:3001/api/share/rejoindre$is_args$args;
        proxy_set_header Host api.evly.ch;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /apercu/ {
        rewrite ^/apercu/(.*)$ /api/share/image/$1 break;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host api.evly.ch;
    }

    # Liens d'application (Android, iPhone)
    location ^~ /.well-known/ {
        default_type application/json;
        try_files $uri =404;
    }

    # Fichiers versionnés de Vite : cache long
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Données de la démo (/demo/data.json, photos, avatars) : toujours revérifiées, sinon le navigateur garde l'ancienne démo
    location ^~ /demo/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Application (une seule page) : toute autre adresse sert index.html, jamais mis en cache.
    # Pas de « $uri/ » : /demo ou /fichiers (dossiers de public/) donnaient un 403 au lieu de la page de l'app
    location / {
        try_files $uri /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), payment=()" always;
    }
}

# --- evly.ch sans www : redirection permanente (comme avant)
server {
    listen 80;
    listen [::]:80;
    server_name evly.ch;
    return 308 https://www.evly.ch$request_uri;
}
